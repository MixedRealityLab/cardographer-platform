volumes:
    uploads: { }
    db: { }

services:
    mongo:
        image: mongo
        networks:
            - internal
        expose:
            - "27017"
        restart: unless-stopped
        volumes:
            - db:/data/db

    platform:
        build: .
        restart: unless-stopped
        networks:
            - web
            - internal
        environment:
            - NODE_OPTIONS=--max_old_space_size=2048
        env_file: "server.env.local"
        depends_on:
            - 'mongo'
        expose:
            - "3000"
        volumes:
            - uploads:/app/uploads
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.cardographer.entrypoints=websecure"
            - "traefik.http.routers.cardographer.rule=Host(`cardographer.cs.nott.ac.uk`)"
            - "traefik.http.services.cardographer.loadbalancer.server.port=3000"

networks:
    web:
        external: true
    internal: